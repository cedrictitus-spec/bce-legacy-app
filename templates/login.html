<!DOCTYPE html>
<html>
<head>
<title>Club Security Admin - Login</title>
<style>
body { font-family: Arial; background-color: #f0f0f0; }
.login-container { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
h1 { text-align: center; color: #333; }
input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
button { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
button:hover { background-color: #45a049; }
.error { color: red; text-align: center; margin: 10px 0; }
</style>
</head>
<body>
<div class="login-container">
<h1>Club Security Admin</h1>
<form method="post">
<input type="text" name="username" placeholder="Username" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}
<p style="text-align: center; font-size: 12px; color: #999; margin-top: 20px;">
Demo credentials: username=admin, password=admin123
</p>
</div>
</body>
</html>
