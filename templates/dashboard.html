<!DOCTYPE html>
<html>
<head>
<title>Club Security Admin - Dashboard</title>
<style>
body { font-family: Arial; background-color: #f0f0f0; margin: 0; }
.navbar { background-color: #333; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
.navbar h2 { margin: 0; }
.logout-btn { background-color: #f44336; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
.logout-btn:hover { background-color: #da190b; }
.container { max-width: 1000px; margin: 20px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
h1 { color: #333; }
.create-user { background-color: #e8f5e9; padding: 20px; border-radius: 4px; margin-bottom: 20px; }
.create-user input { width: 48%; padding: 10px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; }
.create-user button { width: 20%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
.create-user button:hover { background-color: #45a049; }
table { width: 100%; border-collapse: collapse; margin-top: 20px; }
table th, table td { border: 1px solid #ddd; padding: 12px; text-align: left; }
table th { background-color: #f5f5f5; font-weight: bold; }
table tr:hover { background-color: #f9f9f9; }
</style>
</head>
<body>
<div class="navbar">
<h2>Club Security Admin Dashboard</h2>
<div>
<span>Welcome, {{ current_user }}</span>
<a href="/logout" class="logout-btn">Logout</a>
</div>
</div>
<div class="container">
<h1>User Management</h1>

<div class="create-user">
<h3>Create New User</h3>
<form method="post" action="/admin/create-user" style="display: flex; flex-wrap: wrap;">
<input type="text" name="new_username" placeholder="Username" required>
<input type="password" name="new_password" placeholder="Password" required>
<button type="submit">Create User</button>
</form>
</div>

<h3>Registered Users</h3>
<table>
<thead>
<tr>
<th>Username</th>
<th>Role</th>
<th>Created</th>
</tr>
</thead>
<tbody>
{% for user in users %}
<tr>
<td>{{ user.username }}</td>
<td>{{ user.role }}</td>
<td>{{ user.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
</body>
</html>
